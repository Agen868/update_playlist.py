name: Automated Token Playlist Update (Every 5 Mins)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run fetch token script
      run: python fetch_tokens.py

    - name: Commit and Push output playlist
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add playlist.w3u
        git diff-index --quiet HEAD || git commit -m "Update playlist.w3u"
        git push
